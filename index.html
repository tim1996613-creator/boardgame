        const overdue = newcomers.filter(n=>n.status!=="暫停跟進" && isOverdue(n.lastUpdated,n.logs)).length
        const paused = newcomers.filter(n=>n.status==="暫停跟進").length
        return {totalMonth,unassigned,overdue,paused,total:newcomers.length}
      },[newcomers])

        return newcomers.filter(n=>{
          const s = search.trim().toLowerCase()
          const matchSearch = !s || n.name.toLowerCase().includes(s) || n.notes.toLowerCase().includes(s) || n.interests.join("").toLowerCase().includes(s)
          const matchStatus = filterStatus==="全部" || n.status===filterStatus
          const matchAssignee = filterAssignee==="全部" || n.assignedTo===filterAssignee || (filterAssignee==="未分配" && !n.assignedTo)
          const matchTag = filterTag==="全部" || n.interests.includes(filterTag)
          const matchOverdue = !onlyOverdue || (n.status!=="暫停跟進" && isOverdue(n.lastUpdated,n.logs))
          return matchSearch && matchStatus && matchAssignee && matchTag && matchOverdue
        }).sort((a,b)=>b.firstVisitDate.localeCompare(a.firstVisitDate))
      },[newcomers,search,filterStatus,filterAssignee,filterTag,onlyOverdue])

        const c={}; newcomers.forEach(n=>{if(n.status!=="暫停跟進") n.interests.forEach(t=>c[t]=(c[t]||0)+1)}); return Object.entries(c).sort((a,b)=>b[1]-a[1])

        return team.map(m=>({member:m,count:newcomers.filter(n=>n.assignedTo===m.id && n.status!=="暫停跟進").length,list:newcomers.filter(n=>n.assignedTo===m.id && n.status!=="暫停跟進")})).sort((a,b)=>b.count-a.count)

        if(!tags.includes(t)) setTags(p=>[...p,t])
        if(mode==="quick") {setNewcomerDraft(p=>({...p,interests:Array.from(new Set([...(p.interests||[]),t]))})); setTagInput("")}

        const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"})
        const url=URL.createObjectURL(blob)

        const f=e.target.files?.[0]; if(!f) return

          try{

            if(d.tags && Array.isArray(d.tags)) setTags(d.tags)

        if(!editData.name?.trim()) return alert("請填姓名")
        setNewcomers(p=>p.map(m=>m.id===editId?{...m,...editData,lastUpdated:editData.lastUpdated||m.lastUpdated}:m))
        setShowDetail(false); showToast("已儲存")

      const addLog = () => {

                        <div><label className="text-[12px] font-semibold">點樣嚟？</label><input value={newcomerDraft.source||""} onChange={e=>setNewcomerDraft({...newcomerDraft,source:e.target.value})} placeholder="朋友邀請 / 桌遊夜" className="mt-2 w-full h-11 px-4 rounded-xl bg-[#FFFCF8] border text-[14px]" /></div>
                      </div>
                      <div><label className="text-[12px] font-semibold">興趣 / 活動標籤（可自訂）</label><div className="mt-2 flex flex-wrap gap-1.5">{(newcomerDraft.interests||[]).map(t=><span key={t} className="inline-flex gap-1 items-center px-2.5 py-1 rounded-full text-[11px] text-white" style={{background:tagColor(t)}}>{t}<button onClick={()=>setNewcomerDraft({...newcomerDraft,interests:(newcomerDraft.interests||[]).filter(x=>x!==t)})} className="ml-1 w-4 h-4 rounded-full bg-black/20 flex items-center justify-center">✕</button></span>)}</div><div className="mt-2 relative"><input value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault(); if(tagInput.trim()) addTag(tagInput,"quick")}}} placeholder="打字搜尋或新增，例如：露營" className="w-full h-11 px-4 rounded-xl bg-[#FFFCF8] border text-[13px]" />{tagInput.trim() && <div className="absolute z-10 mt-2 w-full bg-white rounded-2xl border shadow p-2 max-h-[180px] overflow-auto">{tags.filter(t=>t.toLowerCase().includes(tagInput.toLowerCase()) && !(newcomerDraft.interests||[]).includes(t)).slice(0,6).map(t=><button key={t} onClick={()=>{setNewcomerDraft(p=>({...p,interests:Array.from(new Set([...(p.interests||[]),t]))})); setTagInput("")}} className="w-full text-left px-3 py-2 rounded-xl hover:bg-[#FFFCF8] text-[13px] flex gap-2 items-center"><span className="w-2 h-2 rounded-full" style={{background:tagColor(t)}}/>{t}</button>)}{!tags.some(t=>t.toLowerCase()===tagInput.trim().toLowerCase()) && <button onClick={()=>addTag(tagInput,"quick")} className="w-full text-left px-3 py-2 rounded-xl bg-[#FFF3E8] border border-[#FFE2CF] text-[13px] text-[#8A5A3A] mt-1">＋ 新增「{tagInput.trim()}」</button>}</div>}</div><div className="mt-2 flex flex-wrap gap-1.5">{tags.filter(t=>!(newcomerDraft.interests||[]).includes(t)).slice(0,8).map(t=><button key={t} onClick={()=>setNewcomerDraft(p=>({...p,interests:Array.from(new Set([...(p.interests||[]),t]))}))} className="px-2.5 py-1 rounded-full bg-white border text-[11px] hover:bg-[#FFFCF8]">{t}</button>)}</div></div>
                      <div><label className="text-[12px] font-semibold">備註</label><textarea value={newcomerDraft.notes||""} onChange={e=>setNewcomerDraft({...newcomerDraft,notes:e.target.value})} rows={2} placeholder="第一印象、傾咗咩..." className="mt-2 w-full px-4 py-3 rounded-xl bg-[#FFFCF8] border text-[13px] resize-none" /></div>
                    </>
                  ) : (
                    <div className="space-y-3">
                      <div className="p-4 rounded-2xl bg-[#FFFBF6] border"><div className="text-[13px] font-semibold">{newcomerDraft.name} 已新增</div><div className="text-[11px] text-[#9A8A84] mt-1">{newcomerDraft.firstVisitDate} · {(newcomerDraft.interests||[]).join("、")||"未標興趣"}</div></div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2">{team.map(m=><button key={m.id} onClick={()=>setNewcomerDraft({...newcomerDraft,assignedTo:m.id})} className={`p-3 rounded-2xl border text-left flex justify-between items-center ${newcomerDraft.assignedTo===m.id?"bg-[#2B3A3E] text-white border-[#2B3A3E]":"bg-white border-[#EFE6DF] hover:bg-[#FFFCF8]"}`}><div className="flex gap-2 items-center"><div className={`w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold ${newcomerDraft.assignedTo===m.id?"bg-white/20":"bg-[#F3F0EB]"}`}>{m.name[0]}</div><div><div className="text-[13px] font-medium">{m.name}</div><div className={`text-[10px] ${newcomerDraft.assignedTo===m.id?"text-white/70":"text-[#9A8A84]"}`}>{m.role} · {newcomers.filter(n=>n.assignedTo===m.id && n.status!=="暫停跟進").length}人跟進中</div></div></div>{newcomerDraft.assignedTo===m.id&&<span>✓</span>}</button>)}</div>
                    </div>
                  )}
                </div>
                <div className="px-6 md:px-8 py-4 border-t bg-[#FFFBF6] flex justify-end gap-3">
                  {addStep===1 ? <><button onClick={()=>setShowAdd(false)} className="h-11 px-6 rounded-full bg-white border text-[13px]">取消</button><button onClick={saveAddStep1} className="h-11 px-7 rounded-full bg-[#2B3A3E] text-white text-[13px] font-semibold">下一步</button></> : <><button onClick={()=>setAddStep(1)} className="h-11 px-6 rounded-full bg-white border text-[13px]">上一步</button><button onClick={saveAddFinal} className="h-11 px-7 rounded-full bg-[#2B3A3E] text-white text-[13px] font-semibold">{newcomerDraft.assignedTo?"確認分配":"暫時唔分配"}</button></>}
                </div>
              </div>
            </div>
          )}
          {showDetail && (
            <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-6">
              <div className="absolute inset-0 bg-[#2B1F1C]/40 backdrop-blur-[6px]" onClick={()=>setShowDetail(false)} />
              <div className="relative w-full md:max-w-[800px] bg-white rounded-t-[28px] md:rounded-[28px] shadow border border-[#F1E8E0] max-h-[92vh] flex flex-col overflow-hidden">
                <div className="px-6 md:px-8 py-5 border-b flex justify-between shrink-0"><div className="flex gap-3 items-center"><div className="w-10 h-10 rounded-full bg-[#F3F0EB] border flex items-center justify-center font-bold">{editData.name?.[0]}</div><div><h2 className="text-[16px] font-bold">{editData.name}</h2><p className="text-[11px] text-[#9A8A84]">首次 {editData.firstVisitDate} · 最後更新 {editData.lastUpdated||"—"}（{timeAgo(editData.lastUpdated||"")}）</p></div></div><div className="flex gap-2"><button onClick={()=>{setToDelete(editData)}} className="w-9 h-9 rounded-full bg-white border text-[12px]">🗑</button><button onClick={()=>setShowDetail(false)} className="w-9 h-9 rounded-full bg-[#FFFCF8] border">✕</button></div></div>
                <div className="overflow-y-auto px-6 md:px-8 py-6 space-y-8">
                  <div><h3 className="text-[12px] font-bold tracking-widest text-[#9A8A84] uppercase mb-3">基本資料</h3><div className="grid md:grid-cols-2 gap-4">
                    <div><label className="text-[11px] font-semibold">姓名 *</label><input value={editData.name||""} onChange={e=>setEditData({...editData,name:e.target.value})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]" /></div>
                    <div><label className="text-[11px] font-semibold">性別</label><select value={editData.gender||""} onChange={e=>setEditData({...editData,gender:e.target.value})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]"><option value="">—</option><option value="男">男</option><option value="女">女</option></select></div>
                    <div><label className="text-[11px] font-semibold">聯絡</label><input value={editData.contact||""} onChange={e=>setEditData({...editData,contact:e.target.value})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]" /></div>
                    <div><label className="text-[11px] font-semibold">首次到訪</label><input type="date" value={editData.firstVisitDate||""} onChange={e=>setEditData({...editData,firstVisitDate:e.target.value})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]" /></div>
                    <div><label className="text-[11px] font-semibold">點樣嚟</label><input value={editData.source||""} onChange={e=>setEditData({...editData,source:e.target.value})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]" /></div>
                    <div><label className="text-[11px] font-semibold">狀態</label><select value={editData.status||"初次接觸"} onChange={e=>setEditData({...editData,status:e.target.value})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]">{Object.keys(STATUS_MAP).map(s=><option key={s} value={s}>{s}</option>)}</select></div>
                    <div className="md:col-span-2"><label className="text-[11px] font-semibold">負責家員</label><select value={editData.assignedTo||""} onChange={e=>setEditData({...editData,assignedTo:e.target.value||null})} className="mt-1.5 w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]"><option value="">未分配</option>{team.map(t=><option key={t.id} value={t.id}>{t.name}（{t.role}）</option>)}</select></div>
                    <div className="md:col-span-2"><label className="text-[11px] font-semibold">興趣標籤</label><div className="mt-1.5 flex flex-wrap gap-1.5">{(editData.interests||[]).map(t=><span key={t} className="inline-flex gap-1 items-center px-2.5 py-1 rounded-full text-[11px] text-white" style={{background:tagColor(t)}}>{t}<button onClick={()=>setEditData({...editData,interests:(editData.interests||[]).filter(x=>x!==t)})} className="ml-1 w-4 h-4 rounded-full bg-black/20 flex items-center justify-center">✕</button></span>)}</div><div className="mt-2 relative"><input value={editTagInput} onChange={e=>setEditTagInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault(); if(editTagInput.trim()) addTag(editTagInput,"edit")}}} placeholder="輸入新增或搜尋標籤" className="w-full h-10 px-3 rounded-xl bg-[#FFFCF8] border text-[13px]" />{editTagInput.trim() && <div className="absolute z-10 mt-2 w-full bg-white rounded-2xl border shadow p-2">{tags.filter(t=>t.toLowerCase().includes(editTagInput.toLowerCase()) && !(editData.interests||[]).includes(t)).slice(0,6).map(t=><button key={t} onClick={()=>{setEditData(p=>({...p,interests:Array.from(new Set([...(p.interests||[]),t]))})); setEditTagInput("")}} className="w-full text-left px-3 py-2 rounded-xl hover:bg-[#FFFCF8] text-[13px] flex gap-2 items-center"><span className="w-2 h-2 rounded-full" style={{background:tagColor(t)}}/>{t}</button>)}{!tags.some(t=>t.toLowerCase()===editTagInput.trim().toLowerCase()) && <button onClick={()=>addTag(editTagInput,"edit")} className="w-full text-left px-3 py-2 rounded-xl bg-[#FFF3E8] border text-[13px] text-[#8A5A3A] mt-1">＋ 新增「{editTagInput.trim()}」</button>}</div>}</div><div className="mt-2 flex flex-wrap gap-1.5">{tags.filter(t=>!(editData.interests||[]).includes(t)).slice(0,8).map(t=><button key={t} onClick={()=>setEditData(p=>({...p,interests:Array.from(new Set([...(p.interests||[]),t]))}))} className="px-2.5 py-1 rounded-full bg-white border text-[11px] hover:bg-[#FFFCF8]">{t}</button>)}</div></div>
                    <div className="md:col-span-2"><label className="text-[11px] font-semibold">備註</label><textarea value={editData.notes||""} onChange={e=>setEditData({...editData,notes:e.target.value})} rows={3} className="mt-1.5 w-full px-3 py-2 rounded-xl bg-[#FFFCF8] border text-[13px] resize-none" /></div>
                  </div></div>
                  <div><div className="flex justify-between mb-3"><h3 className="text-[12px] font-bold tracking-widest text-[#9A8A84] uppercase">關顧日誌（每月更新）</h3><span className={`text-[10px] px-2 py-0.5 rounded-full border ${editData.status!=="暫停跟進" && isOverdue(editData.lastUpdated||"",editData.logs||[])?"bg-rose-50 text-rose-700 border-rose-100":"bg-emerald-50 text-emerald-700 border-emerald-100"}`}>{editData.status==="暫停跟進"?"暫停跟進中":isOverdue(editData.lastUpdated||"",editData.logs||[])?"本月未更新":"本月已更新"}</span></div><div className="p-4 rounded-2xl bg-[#FFFBF6] border space-y-3"><div className="grid grid-cols-2 gap-2"><input type="date" value={logDraft.date} onChange={e=>setLogDraft({...logDraft,date:e.target.value})} className="h-9 px-3 rounded-xl bg-white border text-[12px]" /><select value={logDraft.author} onChange={e=>setLogDraft({...logDraft,author:e.target.value})} className="h-9 px-3 rounded-xl bg-white border text-[12px]"><option value="">記錄人</option>{team.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div><textarea value={logDraft.content} onChange={e=>setLogDraft({...logDraft,content:e.target.value})} rows={2} placeholder="今個月情況點？有冇咩新發現/傾咗咩？" className="w-full px-3 py-2 rounded-xl bg-white border text-[13px] resize-none" /><div className="flex justify-between"><button onClick={()=>pause(editId)} className="h-9 px-4 rounded-full bg-zinc-100 border text-[11px]">⏸ 暫停跟進（唔需要家員跟）</button><button onClick={addLog} disabled={!logDraft.content.trim()} className="h-9 px-5 rounded-full bg-[#2B3A3E] text-white text-[12px] disabled:opacity-40">＋ 新增日誌</button></div></div><div className="mt-4 space-y-3 max-h-[280px] overflow-auto pr-1">{(editData.logs||[]).length===0 && <div className="py-6 text-center text-[12px] text-[#9A8A84]">暫時未有日誌，每月記一次就得。</div>}{(editData.logs||[]).map(l=><div key={l.id} className="flex gap-3"><div className="w-6 h-6 rounded-full bg-[#2B3A3E] text-white flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">{teamMap.get(l.author)?.name[0]||l.author[0]||"?"}</div><div className="flex-1 min-w-0"><div className="flex gap-2 text-[11px] text-[#9A8A84]"><span>{l.date}</span><span>·</span><span>{teamMap.get(l.author)?.name||l.author||"未標記"}</span></div><div className="text-[13px] mt-1 leading-relaxed bg-white border rounded-xl px-3 py-2">{l.content}</div></div><button onClick={()=>setEditData(p=>({...p,logs:(p.logs||[]).filter(x=>x.id!==l.id)}))} className="w-6 h-6 rounded-full bg-[#FFFCF8] border text-[10px] shrink-0">✕</button></div>)}</div></div>
                  <div><h3 className="text-[12px] font-bold tracking-widest text-[#9A8A84] uppercase mb-3">代禱事項</h3><textarea value={editData.prayer||""} onChange={e=>setEditData({...editData,prayer:e.target.value})} rows={3} placeholder="為佢禱告嘅事項..." className="w-full px-4 py-3 rounded-2xl bg-[#FFF9F0] border border-[#FFEEDD] text-[13px] resize-none" /></div>
                </div>
                <div className="px-6 md:px-8 py-4 border-t bg-[#FFFBF6] flex justify-end gap-3 shrink-0"><button onClick={()=>setShowDetail(false)} className="h-11 px-6 rounded-full bg-white border text-[13px]">取消</button><button onClick={saveDetail} className="h-11 px-7 rounded-full bg-[#2B3A3E] text-white text-[13px] font-semibold shadow">儲存更新</button></div>
              </div>
            </div>
          )}
          {toDelete && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4"><div className="absolute inset-0 bg-[#2B1F1C]/40 backdrop-blur-[6px]" onClick={()=>setToDelete(null)} /><div className="relative w-full max-w-[360px] bg-white rounded-[24px] shadow border p-6 text-center"><div className="w-12 h-12 rounded-full bg-rose-50 border border-rose-100 flex items-center justify-center mx-auto mb-4">🗑</div><h3 className="text-[15px] font-bold">確定要刪除？</h3><p className="text-[12px] text-[#8C7A74] mt-1.5">將會刪除 <span className="font-semibold text-[#3D2E2A]">{toDelete.name}</span> 嘅記錄。</p><div className="flex gap-2.5 mt-6"><button onClick={()=>setToDelete(null)} className="flex-1 h-11 rounded-full bg-[#FFFCF8] border text-[13px]">取消</button><button onClick={()=>deleteN(toDelete)} className="flex-1 h-11 rounded-full bg-rose-500 text-white text-[13px] font-semibold">確定刪除</button></div></div></div>
          )}
          {toast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] max-w-[90vw] px-5 py-3 rounded-2xl bg-[#2B3A3E] text-white text-[12px] font-medium shadow text-center" style={{animation:"slideUp .25s ease"}}>{toast}</div>}
        </div>
      )
    }
    createRoot(document.getElementById("root")).render(React.createElement(App))
  </script>
</body>
</html>
